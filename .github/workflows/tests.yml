name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run regression tests (throwaway SQLite, never production)
        env:
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: ':memory:'
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: 'True'
        run: python manage.py test api.test_core_flows
